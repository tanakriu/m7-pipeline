# The deployed pipeline: build, then the two test levels that need real data.
#
# Levels 1 and 2 (unit, transformation) run on the GitHub runner against
# fixtures — they need no workspace and no data. Levels 3 and 4 can only be
# established against the table the build task just wrote, so they are tasks
# of the job itself: Write-Audit-Publish, with the audits failing the run.

resources:
  jobs:
    tree_test:
      name: test_pipeline

      tasks:
        - task_key: print_new
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            # Relative to THIS file (Module 5's rule), so ../src.
            notebook_path: ../src/test_script.py
